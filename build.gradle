plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.+'
}

version = "6.0.9"
group = "pharaun.Gregtania"
archivesBaseName = "Gregtania"
java.targetCompatibility(JavaVersion.VERSION_1_8)

minecraft {
    version("1.7.10")
    setInjectMissingGenerics(true)
    setUsername("bingus")
}

repositories {
    maven {
        name 'Overmind forge repo mirror'
        url 'https://gregtech.overminddl1.com/'
        mavenContent {
            excludeGroup("net.minecraftforge")
        }
    }
    maven {
        name = "GTNH Maven"
        url = "http://jenkins.usrv.eu:8081/nexus/content/groups/public/"
        allowInsecureProtocol = true
    }
}

dependencies {
    //transitive "mcp.mobius.waila:Waila:1.5.11-RC2-NONEI_1.7.10:dev"
    //transitive "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    //transitive "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    //transitive "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    implementation("com.gregoriust.gregtech:gregtech_1.7.10:6.17.01:dev") {
        exclude module: 'ForgeMultipart'
        exclude group: 'mcp.mobius.opis'
    }
    implementation "com.azanor.baubles:Baubles:1.7.10-1.0.1.10:deobf"
    implementation "vazkii.botania:Botania:r1.8-250:deobf"
    compileOnly "com.mod-buildcraft:buildcraft:7.1.23:dev"
    compileOnly "appeng:appliedenergistics2:rv3-beta-6:dev"
    compileOnly "ic2:IC2Classic:1.2.1.8:dev"
    compileOnly "team.chisel.ctmlib:CTMLib:MC1.7.10-1.4.1.5:deobf"
    compileOnly "team.chisel:Chisel:2.9.5.12:deobf"
    implementation fileTree(dir: 'deps', include: '*.jar')
}

jar {
    manifest {
        attributes 'Built-By': 'codewarrior0'
        attributes 'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss")
        attributes 'Built-JDK': System.getProperty('java.version')
        attributes 'Implementation-Title': project.name
        attributes 'Source-Compatibility': project.sourceCompatibility
        attributes 'Target-Compatibility': project.targetCompatibility
    }
}

processResources {
    setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

apply from:'mixin.gradle'